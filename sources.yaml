- id: reddit_humanresources
  lane: question
  adapter: reddit_arctic
  cadence: weekly
  config:
    subreddit: humanresources
    queries: ["return to office", "hybrid policy", "office attendance", "hot desking", "rto mandate"]
    min_comments: 3

- id: reddit_humanresourcesuk
  lane: question
  adapter: reddit_arctic
  cadence: weekly
  config:
    subreddit: HumanResourcesUK
