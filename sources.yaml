# Source registry for the workplace-listening Listener.
# One entry per source. `lane` (question | context) determines everything
# downstream: question sources are short/high-volume/literal, context sources
# are long-form and get summarized at ingest. `adapter` names a module in
# collectors/. `cadence` (weekly | monthly) selects which cron picks it up.
#
# Adapters implemented in Wave 0/1: rss, hackernews, spiceworks, reddit_arctic.
# Sources whose adapter is not yet implemented stay listed here and are skipped
# by run.py with a log line, so the registry is complete from the start.

# =========================================================================== #
# Lane A - question sources (short, high volume, literal buying questions)
# =========================================================================== #
- id: reddit_sysadmin
  lane: question
  adapter: reddit_arctic
  cadence: weekly
  config:
    subreddit: sysadmin
    queries: ["visitor management", "desk booking", "room booking", "hoteling", "space management"]
    min_comments: 3

- id: reddit_k12sysadmin
  lane: question
  adapter: reddit_arctic
  cadence: weekly
  config:
    subreddit: k12sysadmin
    queries: ["visitor management", "visitor sign in", "front office check in", "raptor alternative"]
    min_comments: 2

- id: reddit_msp
  lane: question
  adapter: reddit_arctic
