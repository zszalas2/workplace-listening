- id: spiceworks
  lane: question
  adapter: spiceworks
  cadence: weekly
  config:
    base: https://community.spiceworks.com
    queries: ["visitor management", "desk booking", "room booking", "space management"]

- id: hackernews
  lane: question
  adapter: hackernews
  cadence: weekly
  config:
    queries: ["return to office", "hybrid work", "hot desking", "desk booking", "office occupancy", "return-to-office mandate"]
    min_points: 5

- id: paa_seed_keywords
  lane: question
  adapter: paa
  cadence: monthly
  config:
    provider: dataforseo
    keywords: ["desk booking software", "hot desking software", "room booking system", "meeting room scheduling", "visitor management system", "visitor sign in app", "office occupancy sensors", "workplace analytics software", "hybrid work policy", "return to office policy", "office attendance tracking", "workspace management software", "flex office software", "coworking access for employees", "workspace spend management"]

- id: capterra_reviews
  lane: question
  adapter: reviews_capterra
  cadence: monthly
  config:
    categories: ["desk-booking", "visitor-management", "space-management", "meeting-room-booking"]
    fields: ["cons", "switched_from"]

- id: trustradius_reviews
  lane: question
  adapter: reviews_trustradius
  cadence: monthly
  config:
    categories: ["desk-booking", "visitor-management", "space-management"]

