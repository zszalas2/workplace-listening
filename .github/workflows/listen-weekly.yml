name: listen-weekly
# Runs from the repository root: workplace-listening is now its own repo, so
# run.py and its data/ live at the top level. Wave 0 also runs locally via
# `python3 run.py`.
on:
  schedule:
    - cron: "0 11 * * 1"   # Mondays 11:00 UTC, matching transition-watchlist
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  listen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run weekly collectors + digest
        run: python3 run.py --cadence weekly
      - name: Commit results
        run: |
          git config user.name "listening-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ state.json
          git commit -m "weekly listening run $(date +%F)" || echo "no changes"
          git push
