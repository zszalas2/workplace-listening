name: listen-weekly
# Runs from the repository root: workplace-listening is now its own repo, so
# run.py and its data/ live at the top level. Wave 0 also runs locally via
# `python3 run.py`.
on:
  schedule:
    - cron: "0 11 * * 1"   # Mondays 11:00 UTC, matching transition-watchlist
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  listen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run weekly collectors + digest
        run: python3 run.py --cadence weekly
        env:
          # Synthesis (Wave 1) runs only when this secret is set; otherwise the
          # digest falls back to the counts-only view. Issues sync uses the
          # workflow token and the issues:write permission above.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit results
        run: |
          git config user.name "listening-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ state.json
          git commit -m "weekly listening run $(date +%F)" || { echo "no changes"; exit 0; }
          # Rebase onto any commits that landed during the run, then push with
          # retries, so a concurrent push never drops this run's results.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push && exit 0
            echo "push attempt $i failed; retrying"; sleep 5
          done
          echo "push failed after retries"; exit 1
