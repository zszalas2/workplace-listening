name: listen-weekly
# NOTE: GitHub only runs workflows found at the repository root under
# .github/workflows/. While workplace-listening/ lives inside another repo this
# file is documentation of the intended CI; move it (and set working-directory)
# to the repo root, or extract workplace-listening/ into its own repo, to have
# it fire. Wave 0 is designed to run locally via `python3 run.py` regardless.
on:
  schedule:
    - cron: "0 11 * * 1"   # Mondays 11:00 UTC, matching transition-watchlist
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  listen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workplace-listening
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run weekly collectors + digest
        run: python3 run.py --cadence weekly
      - name: Commit results
        run: |
          git config user.name "listening-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ state.json
          git commit -m "weekly listening run $(date +%F)" || echo "no changes"
          git push
