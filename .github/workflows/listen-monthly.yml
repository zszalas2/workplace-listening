name: listen-monthly
# Runs from the repository root (see listen-weekly.yml).
# Monthly adapters (paa, reviews_*, trends, reports_diff) are Wave 3; until they
# are built run.py skips them with a log line, so this cron is safe to enable now.
on:
  schedule:
    - cron: "0 11 1 * *"   # 1st of the month, 11:00 UTC
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  listen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run monthly collectors + digest
        run: python3 run.py --cadence monthly
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Premium data APIs (placeholders until the secrets are added; adapters
          # no-op cleanly without them). PAA uses DataForSEO or AlsoAsked;
          # Trends uses SerpApi.
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          ALSOASKED_API_KEY: ${{ secrets.ALSOASKED_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      - name: Commit results
        run: |
          git config user.name "listening-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ state.json
          git commit -m "monthly listening run $(date +%F)" || { echo "no changes"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push && exit 0
            echo "push attempt $i failed; retrying"; sleep 5
          done
          echo "push failed after retries"; exit 1
