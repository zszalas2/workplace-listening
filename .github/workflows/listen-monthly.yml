name: listen-monthly
# See listen-weekly.yml for the note on workflow location while nested.
# Monthly adapters (paa, reviews_*, trends, reports_diff) are Wave 3; until they
# are built run.py skips them with a log line, so this cron is safe to enable now.
on:
  schedule:
    - cron: "0 11 1 * *"   # 1st of the month, 11:00 UTC
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  listen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workplace-listening
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run monthly collectors + digest
        run: python3 run.py --cadence monthly
      - name: Commit results
        run: |
          git config user.name "listening-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ state.json
          git commit -m "monthly listening run $(date +%F)" || echo "no changes"
          git push
